# 한·미 장전·장중·장후 풀 브리핑 (하루 최대 6회)
# Vercel은 push 후 자동 재배포됩니다.
#
# GitHub → Settings → Secrets and variables → Actions 에 등록:
#   ANTHROPIC_API_KEY
name: Publish briefing

on:
  schedule:
    # UTC cron · 평일(KST) 기준
    # 07:00 KST = 22:00 UTC (전날) → Sun–Thu UTC = Mon–Fri KST 아침
    - cron: "0 22 * * 0-4" # us-post + kr-pre (full)
    # 12:30 KST = 03:30 UTC
    - cron: "30 3 * * 1-5" # kr-mid (full)
    # 15:40 KST = 06:40 UTC
    - cron: "40 6 * * 1-5" # kr-post (full)
    # 21:50 KST = 12:50 UTC
    - cron: "50 12 * * 1-5" # us-pre (full)
    # 02:00 KST = 17:00 UTC (전날) → Sun–Thu UTC
    - cron: "0 17 * * 0-4" # us-mid (full)
  workflow_dispatch:
    inputs:
      slot:
        description: "Pipeline slot"
        required: true
        type: choice
        options:
          - us-post
          - kr-pre
          - kr-mid
          - kr-post
          - us-pre
          - us-mid
          - morning # us-post then kr-pre
          - all # 전 슬롯 순차 (us-mid → … → us-pre)

permissions:
  contents: write

concurrency:
  group: publish-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve slots
        id: slots
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.slot }}"
            if [ "$INPUT" = "morning" ]; then
              echo "list=us-post kr-pre" >> "$GITHUB_OUTPUT"
            elif [ "$INPUT" = "all" ]; then
              # KST 하루 사이클 순 · 마지막이 최종 published 상태
              echo "list=us-mid us-post kr-pre kr-mid kr-post us-pre" >> "$GITHUB_OUTPUT"
            else
              echo "list=$INPUT" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          # cron 문자열로 슬롯 결정 (지연 실행 시 UTC hour 오판 방지)
          CRON="${{ github.event.schedule }}"
          echo "schedule cron=[$CRON]"
          case "$CRON" in
            "0 22 * * 0-4") echo "list=us-post kr-pre" >> "$GITHUB_OUTPUT" ;;
            "30 3 * * 1-5") echo "list=kr-mid" >> "$GITHUB_OUTPUT" ;;
            "40 6 * * 1-5") echo "list=kr-post" >> "$GITHUB_OUTPUT" ;;
            "50 12 * * 1-5") echo "list=us-pre" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * 0-4") echo "list=us-mid" >> "$GITHUB_OUTPUT" ;;
            # legacy morning cron (removed after 07:00 cutover)
            "20 20 * * 0-4") echo "list=us-post kr-pre" >> "$GITHUB_OUTPUT" ;;
            # legacy kr-mid 11:30 KST
            "30 2 * * 1-5") echo "list=kr-mid" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unknown schedule cron=[$CRON] — refusing default slot"
              exit 1
              ;;
          esac

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is missing. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          FAILED=0
          for slot in ${{ steps.slots.outputs.list }}; do
            echo "::group::pipeline $slot"
            if npm run pipeline -- "$slot"; then
              echo "::group::push $slot"
              npm run push:slot -- "$slot" || echo "::warning::push $slot failed (non-blocking)"
              echo "::endgroup::"
            else
              echo "::error::pipeline $slot failed"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Commit published bundle
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f src/data/published/latest.json ]; then
            git add src/data/published/latest.json
          fi
          if [ -f src/data/published/previous.json ]; then
            git add src/data/published/previous.json
          fi
          if [ -f src/data/published/status.json ]; then
            git add src/data/published/status.json
          fi
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: publish briefing ($(date -u +%Y-%m-%dT%H:%MZ))"
          # 실행 중 main에 다른 푸시가 있으면 non-fast-forward 방지
          git pull --rebase origin "${GITHUB_REF_NAME:-main}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
