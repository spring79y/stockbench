# 한·미 장전·장후 풀 브리핑 + 장중 헤드라인 리프레시
# Vercel은 push 후 자동 재배포됩니다.
#
# GitHub → Settings → Secrets and variables → Actions 에 등록:
#   ANTHROPIC_API_KEY
name: Publish briefing

on:
  schedule:
    # UTC cron · 평일(KST) 기준
    # 05:20 KST = 20:20 UTC (전날) → Sun–Thu UTC = Mon–Fri KST 새벽
    - cron: "20 20 * * 0-4" # us-post + kr-pre (full)
    # 11:30 KST = 02:30 UTC
    - cron: "30 2 * * 1-5" # kr-mid (refresh)
    # 15:40 KST = 06:40 UTC
    - cron: "40 6 * * 1-5" # kr-post (full)
    # 21:50 KST = 12:50 UTC
    - cron: "50 12 * * 1-5" # us-pre (full)
    # 02:00 KST = 17:00 UTC (전날) → Sun–Thu UTC
    - cron: "0 17 * * 0-4" # us-mid (refresh)
  workflow_dispatch:
    inputs:
      slot:
        description: "Pipeline slot"
        required: true
        type: choice
        options:
          - us-post
          - kr-pre
          - kr-mid
          - kr-post
          - us-pre
          - us-mid
          - morning # us-post then kr-pre

permissions:
  contents: write

concurrency:
  group: publish-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Resolve slots
        id: slots
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.slot }}"
            if [ "$INPUT" = "morning" ]; then
              echo "list=us-post kr-pre" >> "$GITHUB_OUTPUT"
            else
              echo "list=$INPUT" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          HOUR=$(date -u +%H)
          MIN=$(date -u +%M)
          echo "UTC ${HOUR}:${MIN}"
          if [ "$HOUR" = "20" ]; then
            echo "list=us-post kr-pre" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "02" ]; then
            echo "list=kr-mid" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "06" ]; then
            echo "list=kr-post" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "12" ]; then
            echo "list=us-pre" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" = "17" ]; then
            echo "list=us-mid" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown schedule hour=$HOUR — defaulting to kr-post"
            echo "list=kr-post" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-4-5
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is missing. Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          for slot in ${{ steps.slots.outputs.list }}; do
            echo "::group::pipeline $slot"
            npm run pipeline -- "$slot"
            echo "::endgroup::"
          done

      - name: Commit published bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/published/latest.json
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore: publish briefing ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
