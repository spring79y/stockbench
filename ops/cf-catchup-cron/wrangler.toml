# Cloudflare Worker: catchup-watchdog wake-up
# Aligns with .github/workflows/catchup-watchdog.yml probe times (UTC).
#
# Cloudflare cron = Quartz-like DOW: 1=SUN … 7=SAT (0 is invalid).
# Prefer SUN-THU / MON-FRI — do not copy GitHub's 0-4 / 1-5 literally.
#
# Workers Free = max 5 cron triggers / account. Keep one probe per slot (~+45m).
# GHA catchup-watchdog.yml still has +45/+65 pairs; this Worker is the SPOF break.
name = "stockbench-catchup-cron"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[triggers]
crons = [
  # morning 07:00 KST → +45m = 22:45 UTC (Sun–Thu)
  "45 22 * * SUN-THU",
  # noon 12:30 KST → +45m = 04:15 UTC
  "15 4 * * MON-FRI",
  # kr-post 15:40 KST → +45m = 07:25 UTC
  "25 7 * * MON-FRI",
  # us-pre 21:50 KST → +45m = 13:35 UTC
  "35 13 * * MON-FRI",
]
