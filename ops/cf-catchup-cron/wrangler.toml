# Cloudflare Worker: catchup-watchdog wake-up
# Aligns with .github/workflows/catchup-watchdog.yml probe times (UTC).
name = "stockbench-catchup-cron"
main = "src/index.ts"
compatibility_date = "2026-08-01"
workers_dev = true

# Same windows as catchup-watchdog.yml (+≈45 / +≈65m after each KST slot).
# Weekends: workflow script still skips; harmless extra dispatch.
[triggers]
crons = [
  # morning 07:00 KST → 22:00 UTC prev day (Sun–Thu UTC)
  "45 22 * * 0-4",
  "5 23 * * 0-4",
  # noon 12:30 KST
  "15 4 * * 1-5",
  "35 4 * * 1-5",
  # kr-post 15:40 KST
  "25 7 * * 1-5",
  "45 7 * * 1-5",
  # us-pre 21:50 KST
  "35 13 * * 1-5",
  "55 13 * * 1-5",
]
